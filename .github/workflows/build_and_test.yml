name: Build and Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MAKEFLAGS: -j4
    steps:
    - uses: actions/checkout@v7

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y g++ make cmake

    - name: Build and run tests
      run: |
        mkdir build && cd build
        cmake .. -DZLIB=OFF -DBOOST=OFF -DGMP=OFF -DMPFR=OFF -DPAPILO=OFF
        make
        ctest --output-on-failure ${MAKEFLAGS}
