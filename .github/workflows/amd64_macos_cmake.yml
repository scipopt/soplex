name: amd64 MacOS CMake

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  native:
    name: amd64•MacOS•CMake
    runs-on: macos-15-intel
    env:
      MAKEFLAGS: -j4
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: brew install boost gmp mpfr
    - name: Check CMake
      run: cmake --version
    - name: Configure
      run: >
        cmake -S. -Bbuild
        -G "Xcode"
        -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_INSTALL_PREFIX=install
    - name: Build
      run: >
        cmake --build build
        --config Release
        ${{env.MAKEFLAGS}} -v
    - name: Test
      run: >
        ctest --test-dir build
        --output-on-failure
        -C Release
        ${{env.MAKEFLAGS}}
    - name: Install
      run: >
        cmake --install build
        --config Release
        -v
